name: Format Check

on: [push, pull_request]

env:
  PUBLIC_SITE_ACCESS: "public"
  # Cloudflare's always-pass Turnstile test site key (public by design).
  PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  build_and_test:
    name: Code Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6

      - name: NPM install
        run: npm install

      - name: Check Code Format
        run: npm run format_check

      - name: Download go misspell utility
        run: go install github.com/client9/misspell/cmd/misspell@latest

      - name: Run misspell to fine misspelled words
        run: misspell -error ./src README.md
