name: Linting

on: [push, pull_request]

env:
  PUBLIC_SITE_ACCESS: "public"
  # Cloudflare's always-pass Turnstile test site key (public by design).
  PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  build_and_test:
    name: Linting and Typechecking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: NPM install
        run: npm install

      - name: Linting
        run: npm run lint

      - name: Typechecking
        run: npm run check
