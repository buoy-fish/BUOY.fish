name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PUBLIC_SITE_ACCESS: "public"
  # Cloudflare's always-pass Turnstile test site key (public by design).
  PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  test:
    name: Lint, Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Svelte type check
        run: npm run check

      - name: Run tests
        run: npm run test_run

      - name: Production build
        run: npm run build

      - name: Test post-deploy check script
        run: bash scripts/test/post-deploy-check.test.sh

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    # Serialize deploys so each run's post-deploy check sees its own build,
    # not a newer one deployed by an overlapping run.
    concurrency:
      group: deploy-buoy-fish-website
      cancel-in-progress: false
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          PUBLIC_SITE_ACCESS: "public"
          # Turnstile site key (public, baked in at build time via
          # $env/static/public). A repo variable, not a secret. app.buoy.fish
          # holds the secret and verifies tokens (ADR-0039). Without a real
          # key the contact and proposal forms reject every submission, so
          # refuse to build rather than ship broken forms.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ] || [ "$PUBLIC_TURNSTILE_SITE_KEY" = "1x00000000000000000000AA" ]; then
            echo "::error::Set the PUBLIC_TURNSTILE_SITE_KEY repo variable to the production Turnstile site key"
            exit 1
          fi
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=buoy-production-website --branch=main --commit-dirty=true

      # buoy-fish/monitoring#42: wrangler going green only means Pages
      # accepted the upload. Assert https://buoy.fish now serves the build
      # this job produced (version.json + home page entry chunk).
      - name: Post-deploy health check
        run: bash scripts/post-deploy-check.sh --base-url https://buoy.fish --build-dir .svelte-kit/cloudflare --timeout 180
