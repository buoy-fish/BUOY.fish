name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || 'https://fake_test_url.supabase.co' }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || 'fake_anon_key' }}
  PRIVATE_SUPABASE_SERVICE_ROLE: ${{ secrets.PRIVATE_SUPABASE_SERVICE_ROLE || 'fake_service_role' }}
  PRIVATE_STRIPE_API_KEY: ${{ secrets.PRIVATE_STRIPE_API_KEY || 'fake_stripe_api_key' }}
  PUBLIC_SITE_ACCESS: "public"

jobs:
  test:
    name: Lint, Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Svelte type check
        run: npm run check

      - name: Run tests
        run: npm run test_run

      - name: Production build
        run: npm run build

      - name: Test post-deploy check script
        run: bash scripts/test/post-deploy-check.test.sh

  migrations:
    name: Migrations roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - name: Every migration has a rollback
        run: |
          bash scripts/test/check-migration-rollbacks.test.sh
          bash scripts/check-migration-rollbacks.sh

      - name: Apply, roll back, re-apply against a throwaway Supabase Postgres
        env:
          SUPABASE: supabase
        run: |
          supabase db start
          bash scripts/migration-roundtrip.sh

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [test, migrations]
    # Serialize deploys so each run's post-deploy check sees its own build,
    # not a newer one deployed by an overlapping run.
    concurrency:
      group: deploy-buoy-fish-website
      cancel-in-progress: false
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write
      id-token: write # GitHub OIDC -> OpenBao

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      # GitHub OIDC -> role buoy.fish-deploy, read-only on secret/BUOY.fish/*.
      # Values are managed at https://bao.buoy.fish (secret/BUOY.fish/deploy):
      # rotate there, not in GitHub. exportEnv: false keeps the DB URL out of
      # the job env; only the migration step receives it.
      - name: Fetch deploy secrets from OpenBao
        id: bao
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          exportEnv: false
          url: https://bao.buoy.fish
          method: jwt
          path: github-actions
          role: buoy.fish-deploy
          jwtGithubAudience: https://bao.buoy.fish
          secrets: |
            secret/data/BUOY.fish/deploy SUPABASE_DB_URL

      # Migrations run BEFORE the new code ships, so each one must be
      # backward-compatible with the code currently live (expand, deploy,
      # then contract in a later PR). Every one has a tested rollback in
      # supabase/rollbacks/; undo with the "Roll back a migration" workflow.
      - name: Apply database migrations
        env:
          SUPABASE_DB_URL: ${{ steps.bao.outputs.SUPABASE_DB_URL }}
        run: |
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PRIVATE_SUPABASE_SERVICE_ROLE: ${{ secrets.PRIVATE_SUPABASE_SERVICE_ROLE }}
          PRIVATE_STRIPE_API_KEY: ${{ secrets.PRIVATE_STRIPE_API_KEY }}
          PUBLIC_SITE_ACCESS: "public"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=buoy-production-website --branch=main --commit-dirty=true

      # buoy-fish/monitoring#42: wrangler going green only means Pages
      # accepted the upload. Assert https://buoy.fish now serves the build
      # this job produced (version.json + home page entry chunk).
      - name: Post-deploy health check
        run: bash scripts/post-deploy-check.sh --base-url https://buoy.fish --build-dir .svelte-kit/cloudflare --timeout 180
